name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 清理磁盘（runner 自带的 SDK/.NET 很占地方）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 准备 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装打包依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev libltdl-dev ccache
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer cython

      - name: 缓存 Android SDK/NDK（省掉每次 5~8 分钟下载）
        uses: actions/cache@v4
        with:
          path: |
            .buildozer/android/platform/android-sdk
            .buildozer/android/platform/android-ndk-r25b
            .buildozer/android/platform/python-for-android
            /home/runner/.buildozer
          key: sdk-ndk-${{ runner.os }}-v2

      - name: 打包 APK（首次约 25~35 分钟）
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee buildozer.log

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ahut-sign-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: 失败时导出日志（只打印最后 120 行）
        if: failure()
        run: |
          echo "===== buildozer 最后 120 行 ====="
          tail -n 120 buildozer.log || true
          echo
          echo "===== p4a build.log 最后 80 行 ====="
          for f in $(find .buildozer -name build.log 2>/dev/null); do
            echo "--- $f ---"
            tail -n 80 "$f"
          done
          df -h /
