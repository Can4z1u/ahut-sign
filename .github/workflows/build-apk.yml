name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    # 让 p4a 内部调用的 pip 也遵守 constraints.txt（它不带 --platform，装不了 Android 轮子）
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/constraints.txt

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 清理磁盘（runner 自带的 SDK/.NET 很占地方）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 准备 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装打包依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev libltdl-dev ccache
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer cython

      - name: 缓存 Android SDK/NDK（省掉每次 5~8 分钟下载）
        uses: actions/cache@v4
        with:
          path: |
            .buildozer/android/platform/android-sdk
            .buildozer/android/platform/android-ndk-r25b
            .buildozer/android/platform/python-for-android
            /home/runner/.buildozer
          key: sdk-ndk-${{ runner.os }}-v2

      - name: 预检查依赖解析（10 秒，提前发现 Android 轮子问题）
        run: |
          pip install --dry-run --only-binary=:all: \
            --platform android_24_arm64_v8a --python-version 3.14 \
            --implementation cp --abi cp314 --report /tmp/report.json \
            requests > /dev/null
          python - <<'EOF'
          import json
          report = json.load(open("/tmp/report.json"))
          for m in report["install"]:
              print("解析到:", m["metadata"]["name"], m["metadata"]["version"],
                    "->", m["download_info"]["url"].split("/")[-1])
          bad = [m for m in report["install"] if "android" in m["download_info"]["url"]]
          if bad:
              raise SystemExit("仍有 Android 轮子被选中，约束没生效")
          EOF

      - name: 打包 APK（首次约 25~35 分钟）
        run: |
          # 不用 pipefail：`yes` 在 buildozer 结束时会因 SIGPIPE 退出(141)，
          # 会把"构建成功"误判成失败。这里改用 PIPESTATUS 取 buildozer 自己的退出码。
          set +o pipefail
          yes 2>/dev/null | buildozer -v android debug 2>&1 | tee buildozer.log
          exit ${PIPESTATUS[1]}

      - name: 上传 APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ahut-sign-apk
          path: bin/*.apk
          if-no-files-found: warn

      - name: 失败时导出日志（只打印关键行）
        if: failure()
        run: |
          echo "===== 关键错误行 ====="
          grep -n -E "ERROR:|error:|FAILURE|Traceback|Command failed|not a supported wheel" buildozer.log | tail -n 60 || true
          echo
          echo "===== buildozer 最后 30 行 ====="
          tail -n 30 buildozer.log || true
          echo
          echo "===== p4a build.log 最后 60 行 ====="
          for f in $(find .buildozer -name build.log 2>/dev/null); do
            echo "--- $f ---"
            tail -n 60 "$f"
          done
          df -h /
